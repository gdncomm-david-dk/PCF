<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ULP Approval harness</title>
<link rel="stylesheet" href="/out/controls/ApprovalUIManagement/styles/ApprovalUIManagement.css">
<style>
  html, body { margin: 0; height: 100%; background: #f5f5f5; font-family: "Segoe UI", Arial, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #12171d; color: #fff; font-size: 12px; }
  #bar button { background: #28323b; color: #fff; border: 0; border-radius: 12px; padding: 4px 10px; cursor: pointer; }
  #stage { flex: 1; display: flex; justify-content: center; min-height: 0; }
  #host { flex: 1; max-width: var(--w, 100%); height: 100%; }
  #log { height: 110px; overflow: auto; margin: 0; padding: 8px 12px; background: #19222a; color: #b2efb9; font: 11px/1.4 ui-monospace, monospace; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <strong>ULP Approval harness</strong>
    <span>width:</span>
    <button data-w="100%">desktop</button><button data-w="900px">tablet</button><button data-w="390px">mobile</button>
    <span style="margin-left:auto">simulates the ApprovalScreen Power Fx handler (cascade + roll-up)</span>
  </div>
  <div id="stage"><div id="host"></div></div>
  <pre id="log"></pre>
</div>
<script src="/out/controls/ApprovalUIManagement/bundle.js"></script>
<script src="/harness/mock.js"></script>
</body>
</html>
